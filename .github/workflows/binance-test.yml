name: Binance P2P VND On-Demand Lookup

"on":
  workflow_dispatch:
    inputs:
      chat_id:
        description: Telegram chat ID
        required: true
        type: string
      request_id:
        description: Request identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  query-and-reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Binance and reply to Telegram
        env:
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python scripts/binance_lookup.py
